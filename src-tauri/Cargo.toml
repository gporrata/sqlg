[package]
name = "sqlg-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "sqlg desktop app"

[lib]
name = "sqlg_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures = "0.3"
notify = "8"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlg-core = { path = "../crates/sqlg-core" }
sqlparser = { version = "0.63", features = ["visitor"] }
sqlx = { version = "0.8", default-features = false, features = ["mysql", "runtime-tokio", "tls-rustls-ring-native-roots", "chrono"] }
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["time", "rt"] }
uuid = { version = "1", features = ["v4"] }
