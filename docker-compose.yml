# Example databases for the Electron SQL POC.
#
# Usage:
#   docker compose up -d
#   docker compose down -v        # also wipes volumes

services:
  mysql:
    image: mysql:8
    container_name: sqlg-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: sqlg
      MYSQL_DATABASE: sqlg
    ports:
      - "33306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-psqlg"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - sqlg_mysql:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro

  mysql-connection:
    image: node:20-alpine
    working_dir: /workspace
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SQLG_USERNAME: root
      SQLG_PASSWORD: sqlg
      SQLG_HOST_USER: ${USER}
    volumes:
      - .:/workspace:ro
      - ${HOME}/.config/sqlg:/root/.config/sqlg
      - /etc/passwd:/host/etc/passwd:ro
    command:
      - sh
      - -lc
      - |
        set -e
        node scripts/connections.cjs add 'Local MySQL' mysql 127.0.0.1:33306/sqlg
        node scripts/fix-config-owner.cjs /root/.config/sqlg

  postgres:
    image: postgres:16
    container_name: sqlg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sqlg
      POSTGRES_PASSWORD: sqlg
      POSTGRES_DB: sqlg
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sqlg -d sqlg"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - sqlg_postgres:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro

  postgres-connection:
    image: node:20-alpine
    working_dir: /workspace
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SQLG_USERNAME: sqlg
      SQLG_PASSWORD: sqlg
      SQLG_HOST_USER: ${USER}
    volumes:
      - .:/workspace:ro
      - ${HOME}/.config/sqlg:/root/.config/sqlg
      - /etc/passwd:/host/etc/passwd:ro
    command:
      - sh
      - -lc
      - |
        set -e
        node scripts/connections.cjs add 'Local Postgres' postgres 127.0.0.1:55432/sqlg
        node scripts/fix-config-owner.cjs /root/.config/sqlg

volumes:
  sqlg_mysql:
  sqlg_postgres:
