name: CI

on:
  push:
  pull_request:

jobs:
  frontend:
    name: Electron POC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn run check
      - run: yarn build
