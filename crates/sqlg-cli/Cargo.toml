[package]
name = "sqlg-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "sqlg command-line tool"

[[bin]]
name = "sqlg"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rpassword = "7"
serde_json = "1"
sqlg-core = { path = "../sqlg-core" }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
